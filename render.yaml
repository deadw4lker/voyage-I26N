services:
  - type: web
    name: voyage-i26n-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: BOOT_SIMS
        value: 80

  - type: web
    name: voyage-i26n
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/ice-proxy.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SIH_BACKEND
        value: https://voyage-i26n-backend.onrender.com
